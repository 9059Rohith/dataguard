apiVersion: v1
kind: Namespace
metadata:
  name: dataguard
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
# Create dataguard-runtime Secret out of band; see deployment runbook.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataguard
  namespace: dataguard
spec:
  replicas: 1
  selector:
    matchLabels: {app: dataguard}
  template:
    metadata:
      labels: {app: dataguard}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: ghcr.io/your-org/dataguard:1.0.0
          imagePullPolicy: Always
          ports: [{containerPort: 8000, name: http}]
          envFrom: [{secretRef: {name: dataguard-runtime}}]
          env:
            - {name: DATAGUARD_AUTO_INIT, value: "false"}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          startupProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {medium: Memory, sizeLimit: 16Mi}}]
---
apiVersion: v1
kind: Service
metadata: {name: dataguard, namespace: dataguard}
spec:
  selector: {app: dataguard}
  ports: [{port: 8000, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: dataguard-boundary, namespace: dataguard}
spec:
  podSelector: {matchLabels: {app: dataguard}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
      ports: [{protocol: TCP, port: 8000}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - ipBlock: {cidr: 10.20.0.0/16}
      ports: [{protocol: TCP, port: 5432}]
